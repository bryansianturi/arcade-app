[project]
name = "arcade"
version = "0.1.0"
description = "An extensible all-in-one desktop arcade of small games and tools, built with pygame-ce."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools/web"]  # vendored CPython source

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
]
ignore = [
    "B027",    # BaseApp's empty lifecycle hooks are optional overrides by design
    "RUF012",  # ClassVar annotations on mutable class attrs are noise for app metadata
]
allowed-confusables = ["×", "–", "−"]

[tool.ruff.lint.isort]
known-first-party = ["core", "screens", "apps"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["main.py", "core", "screens", "apps", "tests", "tools"]
exclude = ["^build/", "^dist/", "^tools/web/"]  # build output, vendored CPython source

[[tool.mypy.overrides]]
module = ["fontTools", "fontTools.*", "tzdata"]  # untyped (tzdata is just data files)
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_unreachable = false  # tests mutate state through calls, which mypy can't follow
strict_equality = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
